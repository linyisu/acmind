services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: acmind
      MYSQL_USER: acmind
      MYSQL_PASSWORD: acmind
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "acmind", "-pacmind"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Load the whole .env into the container, exactly like a local `cargo run`
    # (DATABASE_URL, JWT, RATE_LIMIT, LLM_*, …). DATABASE_URL in .env is the
    # switch that decides which database this stack talks to:
    #   full local docker  → mysql://acmind:acmind@mysql:3306/acmind
    #   server / external  → mysql://<user>:<pass>@<host>:<port>/acmind
    env_file:
      - .env
    ports: ["8080:8080"]
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports: ["5173:80"]
    depends_on:
      - api

volumes:
  mysql_data:
